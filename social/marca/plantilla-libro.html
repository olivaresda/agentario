<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<!-- Plantilla de marca del libro para redes. La rellena herramientas/social/imagen.mjs.
     Campos: {{formato}} {{antetitulo}} {{titular}} {{bajada}} {{ficha}} {{dato}} {{url}} -->
<style>
@font-face{font-family:"Literata";font-weight:400;src:url(fuentes/literata-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Literata";font-weight:500;src:url(fuentes/literata-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Literata";font-weight:700;src:url(fuentes/literata-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-weight:400;src:url(fuentes/ibm-plex-sans-condensed-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-weight:500;src:url(fuentes/ibm-plex-sans-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-weight:600;src:url(fuentes/ibm-plex-sans-condensed-latin-600-normal.woff2) format("woff2")}
:root{
  --papel:#E9EEF2; --tarjeta:#FBFCFD; --tinta:#14233A; --tinta-suave:#4E5E72; --linea:#C3CDD7;
  --lapiz:#C9962B; --lapiz-suave:#F2E4C2; --cuadro:#A3A096;
}
*{box-sizing:border-box;margin:0}
html,body{width:var(--w);height:var(--h);overflow:hidden}
body{background:var(--papel);color:var(--tinta);font-family:"Literata",Georgia,serif;position:relative}
body.vertical{--w:1080px;--h:1350px;--pad:84px}
body.horizontal{--w:1200px;--h:675px;--pad:64px}
.sans{font-family:"IBM Plex Sans Condensed",Arial,sans-serif}

.lienzo{position:absolute;inset:0;padding:var(--pad);display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:18px;color:var(--tinta-suave)}
.marca svg{flex:none}
.vertical .marca{font-size:30px}
.vertical .marca svg{width:60px;height:60px}
.horizontal .marca{font-size:23px}
.horizontal .marca svg{width:46px;height:46px}

h1{font-weight:700;letter-spacing:-.015em;line-height:1.05;text-wrap:balance}
.vertical h1{font-size:var(--t,92px);margin-top:70px;max-width:920px}
.horizontal h1{font-size:var(--t,60px);margin-top:28px;max-width:660px}
.bajada{color:var(--tinta-suave);font-weight:400;line-height:1.3;text-wrap:pretty}
.vertical .bajada{font-size:40px;margin-top:30px;max-width:880px}
.horizontal .bajada{font-size:27px;margin-top:18px;max-width:640px}

.ficha{background:var(--tarjeta);border:1.5px solid var(--linea);box-shadow:22px 22px 0 var(--lapiz-suave)}
.ficha h2{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-weight:500;border-bottom:4px solid #9A9C94;padding-bottom:.35em;margin-bottom:.55em}
.ficha dt{font-family:"IBM Plex Sans Condensed",Arial,sans-serif;font-weight:500;color:var(--tinta-suave)}
.ficha dd{font-weight:500;line-height:1.3;margin-bottom:.7em}
.ficha dd:last-child{margin-bottom:0}
.vertical .ficha{margin-top:auto;padding:40px 46px;transform:rotate(-1.6deg);max-width:860px;align-self:flex-end}
.vertical .ficha h2{font-size:32px}
.vertical .ficha dt{font-size:24px}
.vertical .ficha dd{font-size:34px}
.horizontal .ficha{position:absolute;right:56px;top:150px;width:390px;padding:24px 28px;transform:rotate(-2deg)}
.horizontal .ficha h2{font-size:22px}
.horizontal .ficha dt{font-size:16px}
.horizontal .ficha dd{font-size:21px}

.dato{display:flex;align-items:baseline;gap:16px;color:var(--tinta)}
.dato::before{content:"";flex:none;width:.6em;height:.6em;background:var(--cuadro);transform:translateY(.05em)}
.vertical .dato{margin-top:64px;font-size:30px}
.horizontal .dato{margin-top:auto;font-size:24px}
.url{color:var(--tinta-suave)}
.vertical .url{margin-top:18px;font-size:28px}
.horizontal .url{margin-top:12px;font-size:21px}
</style>
</head>
<body class="{{formato}}">
  <main class="lienzo">
    <div class="marca sans">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#14233A"/><g transform="rotate(-45 32 32)"><rect x="9" y="26" width="6" height="12" rx="2" fill="#F2E4C2"/><rect x="15" y="26" width="28" height="12" fill="#C9962B"/><polygon points="43,26 55,32 43,38" fill="#F2E4C2"/></g></svg>
      <span>{{antetitulo}}</span>
    </div>
    <h1>{{titular}}</h1>
    <p class="bajada">{{bajada}}</p>
    <section class="ficha">
      <h2>Ficha de especificación</h2>
      <dl>{{ficha}}</dl>
    </section>
    <p class="dato sans">{{dato}}</p>
    <p class="url sans">{{url}}</p>
  </main>
</body>
</html>
