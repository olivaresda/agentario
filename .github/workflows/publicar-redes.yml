# Publica en X, LinkedIn e Instagram cada propuesta aprobada del agente de redes.
# El agente (tarea programada en Claude) abre cada mañana un pull request con social/cola/AAAA-MM-DD.json
# y sus imágenes. Al aprobarlo (merge a main), esta acción publica y guarda el historial.
name: Publicar en redes

on:
  push:
    branches: [main]
    paths:
      - social/cola/**
  workflow_dispatch:
    inputs:
      prueba:
        description: Solo simular (no publica nada)
        type: boolean
        default: false
      redes:
        description: "Solo estas redes, separadas por coma (vacío = todas): x,linkedin,instagram"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: redes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar
        env:
          PRUEBA: ${{ inputs.prueba && '1' || '' }}
          REDES: ${{ inputs.redes }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTOR: ${{ secrets.LINKEDIN_AUTOR }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_VERSION: ${{ vars.IG_VERSION }}
        run: node herramientas/social/publicar.mjs
      - name: Guardar historial
        if: always()
        run: |
          git add -A social
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Registrar publicaciones en redes"
          git pull --rebase
          git push
